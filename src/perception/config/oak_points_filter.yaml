# The OAK-D depth pipeline for Nav2's camera obstacle layers, built in one
# container by launch/oak_points_filter.launch.py: an XYZ cloud straight from the
# depth image, published as /oak/points_filtered.
# There is no crop box: the real OAK-D does not see the robot (checked in its
# frames; measured 2026-10-05: zero points inside a +-0.40 m box over 80 clouds),
# so every obstacle point is kept, however close.
#
# The camera publishes depth unaligned at 320x240 (einride-mini-truck's
# oak_d_lite.yaml), so the cloud is 76,800 points at 16 bytes (XYZ, no colour) =
# 1.2 MB, against the vendor /oak/points' 921,600 points at 32 bytes = 29.5 MB.
# That needs no resize or voxel step. One pixel spans 0.22 deg (HFOV 70.4 deg /
# 320 px): 1.2 cm at 3 m.
oak_depth_points:
  ros__parameters:
    # Drop a frame rather than queue it: nav2_collision_monitor discards a camera
    # source older than its `source_timeout` (nav2_params.yaml), so a queued, old
    # cloud is worse than a missing one.
    queue_size: 1
