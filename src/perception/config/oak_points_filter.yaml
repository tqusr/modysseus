# The OAK-D depth pipeline for Nav2's camera obstacle layers, built in one
# container by launch/oak_points_filter.launch.py: a quarter-resolution XYZ cloud
# from the depth image, then a voxel filter, published as /oak/points_filtered.
# There is no crop box: the real OAK-D does not see the robot (checked in its
# frames; measured 2026-10-05: zero voxel points inside a +-0.40 m box over 80
# clouds), so every obstacle point is kept, however close.
#
# 1280x720 -> 320x180 = 57,600 points at 16 bytes (XYZ, no colour) = 0.9 MB,
# against /oak/points' 921,600 points at 32 bytes = 29.5 MB. One pixel now spans
# 0.35 deg (HFOV 69.85 deg / 320 px): 1.8 cm at 3 m and 3.1 cm at 5 m, still at
# or under the 3 cm voxel leaf and the costmaps' 5 cm cells. The OAK's own depth
# is already computed at half resolution (the ROBOTICS preset decimates by 2, see
# the vendor's oak_d_lite.yaml), so the full image held less detail than its
# pixel count suggests.
oak_depth_resize:
  ros__parameters:
    use_scale: true
    scale_width: 0.25
    scale_height: 0.25
    # 0 = nearest neighbour, not the default 1 (linear): averaging across an
    # object's edge invents points between it and the wall behind, and averaging
    # with a 0 (no depth) pixel invents points near the camera. ResizeNode
    # scales camera_info's K and P with the image, so the cloud lands where a
    # full-resolution one would.
    interpolation: 0

oak_depth_points:
  ros__parameters:
    # Drop a frame rather than queue it (see max_queue_size below).
    queue_size: 1

# Voxel downsample, a latency fix and not a filtering one: nav2_collision_monitor
# discards a camera source older than its `source_timeout` (nav2_params.yaml),
# and the full 29.5 MB cloud crossing DDS starved it of fresh data, so safety
# stopping fell back to the lidar alone.
#
# leaf_size 0.03 m is finer than anything downstream represents: both costmaps
# use `resolution: 0.05` and collision_monitor's PolygonStop/PolygonSlow are
# 0.5 m / 0.8 m squares needing `min_points: 4`. It cuts density only, not field
# of view or height: points are merged with their 3 cm neighbours, never removed
# for where they are.
#
# It runs in the cloud's own (optical) frame because this node type declares no
# input_frame/output_frame.
filter_voxel_grid_node:
  ros__parameters:
    leaf_size: 0.03
    # pcl_ros's VoxelGrid also range-filters, by default on z in [0, 1.0]. In
    # the optical frame z is distance from the camera, so the default silently
    # dropped every point beyond 1 m (a synthetic wall at 2 m came out empty).
    # 3.5 m covers nav2_params.yaml's camera layers (obstacle_max_range 2.5,
    # raytrace_max_range 3.0) with margin.
    filter_field_name: z
    filter_limit_min: 0.0
    filter_limit_max: 3.5
    # Keep only the newest pending cloud. The default 3 lets a slow consumer
    # build a backlog and serve collision_monitor frames already old. Depth 1
    # bounds staleness to one processing period.
    max_queue_size: 1
