### opennav_docking's `docking_server` (nav2_util::LifecycleNode) parameters.
#
# Dock x/y positions are DERIVED from `src/mission/config/docks.yaml` (THAT
# FILE IS THE SOURCE OF TRUTH for where the arena's docks physically are).
# They are not a straight copy: each pose here is that dock's pose moved
# 0.126 m outward along its own approach heading, because docks.yaml's
# dock_pose is the dock's back WALL and this file's pose is where the ROBOT
# must end up -- see the measured chassis-standoff note on the `docks:`
# block below. If you change a dock's x/y in docks.yaml, re-derive the
# matching `pose:` entry below with that same offset. The
# `docks:` list and each dock's `type`/`frame`/`pose`/`id` block here are
# opennav_docking's own dock-database format (parsed by its own
# `parseDockParams`), NOT the same YAML schema as mission's docks.yaml.
#
# IMPORTANT -- theta here is DELIBERATELY ROTATED BY PI FROM docks.yaml'S
# theta FOR THE SAME DOCK. This isn't a bug; it's two different physical
# quantities that happen to be measured from the same tag:
#   - mission/config/docks.yaml's dock_pose.theta = the tag's own outward
#     (room-facing) normal -- confirmed empirically (Task 4 + this task) by
#     standing a robot at dock_pose.theta+pi and seeing the tag centered in
#     its camera.
#   - opennav_docking's dock pose.theta (below) = the robot's own final
#     NOSE-FORWARD heading once docked, per its source
#     (opennav_docking/src/docking_server.cpp's approachDock(): with
#     dock_backwards=false the controller drives the robot's base_frame
#     straight toward this pose, ending with this exact heading -- there is
#     no internal flip in that code path, unlike the dock_backwards=true
#     path which flips the *target* by pi internally for its own reverse-
#     motion trick). For a robot that noses straight into a wall-mounted
#     dock (this arena: all 8 docks sit flush against a wall, tag facing
#     into the room), "final nose-forward heading" is necessarily INTO the
#     wall -- i.e. the opposite of the tag's own outward normal. Hence
#     pose.theta here = docks.yaml's dock_pose.theta + pi (normalized).
#
# Plugin choice: `opennav_docking::SimpleChargingDock` with
# `use_external_detection_pose: false` -- i.e. FIXED-POSE docking against the
# known world/map poses below, not vision-corrected (AprilTag) final
# approach. opennav_docking *does* support vision correction (it subscribes
# a single global `detected_dock_pose` topic, applying
# `external_detection_translation_*`/`external_detection_rotation_*` offsets,
# with no per-dock ID filtering in the plugin itself -- whatever PoseStamped
# arrives there is trusted as the dock in view). Wiring that up for real
# would need a new small node bridging apriltag_ros's `/detections`
# (AprilTagDetectionArray, camera-optical-frame poses, Task 4) into that one
# PoseStamped topic, which also means adding Python-node scaffolding to this
# package (currently ament_cmake, config/launch only) and empirically
# calibrating the external_detection_translation/rotation offsets against
# the dock model's actual tag-mount geometry. The task brief explicitly
# allows the fixed-pose fallback "if the AprilTag integration proves
# complex", and the risk/time profile here (new node, new frame-transform
# chain, calibration against an unknown tag-mount offset, on top of the
# lifecycle-watchdog work this task already needs) outweighs the benefit
# for this iteration: arena localization (Task 3) already gives a drift-
# corrected `map` frame, and the docking_server transforms each dock's pose
# from its own `frame` (map) into `fixed_frame` (odom) via tf2 every control
# cycle regardless, so the fixed-pose approach still benefits from
# localization corrections up to the point docking starts. Revisit this if
# fixed-pose docking proves insufficiently precise in practice.
#
# dock_backwards: false (robot drives NOSE-FORWARD the whole approach,
# constant heading) -- chosen after a real false-start in this task's
# verification: an earlier config used `dock_backwards: true` with
# `pose.theta` copied UNFLIPPED from docks.yaml and a `staging_yaw_offset`
# chosen to patch the mismatch. That left the controller's internal target
# orientation (docks.yaml's theta) inconsistent with the staging pose it
# was actually driven to, which put the robot's whole straight-line approach
# exactly on the dock's own axis of symmetry needing a disguised ~180 degree
# reorientation mid-approach -- a known singular configuration for this
# smooth pose-regulation controller (Astolfi/Samson-style; see `controller.
# k_phi`/`k_delta`/`beta`/`lambda` below) that cannot resolve both position
# and heading error from that exact line, and the robot span in place at
# `v_angular_max` until `dock_approach_timeout` repeatedly, never docking.
# With pose.theta correctly flipped (this file) and dock_backwards: false,
# staging and dock_pose share the same heading by construction (see
# staging_x_offset below) -- no reorientation needed anywhere in the
# approach, no singularity.
docking_server:
    ros__parameters:
        use_sim_time: true

        controller_frequency: 50.0
        initial_perception_timeout: 5.0
        wait_charge_timeout: 5.0
        dock_approach_timeout: 30.0
        undock_linear_tolerance: 0.05
        undock_angular_tolerance: 0.05
        max_retries: 3
        base_frame: "base_footprint"   # NOT base_link -- see repo-wide lesson
        fixed_frame: "odom"
        dock_backwards: false          # nose-forward, constant heading throughout (see header comment)
        dock_prestaging_tolerance: 0.5

        dock_plugins: ["arena_dock"]
        arena_dock:
            plugin: "opennav_docking::SimpleChargingDock"
            use_battery_status: false       # sim has no battery topic
            use_external_detection_pose: false   # fixed-pose fallback -- see header comment
            docking_threshold: 0.05
            # staging = dock_pose + staging_x_offset * (cos th, sin th);
            # staging.theta = dock_pose.theta + staging_yaw_offset. Negative
            # offset places staging BEHIND dock_pose along its own heading
            # (th), matching opennav_docking's own documented convention
            # ("staging pose offset forward (negative) of dock pose"), and
            # a 0 yaw offset keeps staging.theta == dock_pose.theta so the
            # robot never has to reorient during the approach.
            staging_x_offset: -0.6
            staging_yaw_offset: 0.0

        # The 8 arena docks. `pose` is [x, y, theta] in `frame`. theta is
        # mission/config/docks.yaml's dock_pose.theta + pi, normalized to
        # (-pi, pi] -- see header comment for why. `id` carries the AprilTag
        # id (unused by SimpleChargingDock in fixed-pose mode; kept for
        # documentation / future vision mode).
        #
        # ===== CHASSIS STANDOFF (0.126 m), MEASURED 2026-10-02 =====
        #
        # x/y are NOT a verbatim copy of docks.yaml's dock_pose any more.
        # Each is that dock's pose moved 0.126 m OUTWARD, i.e. back along
        # its own approach heading:
        #
        #     pose.x = docks.yaml dock_pose.x - 0.126 * cos(theta)
        #     pose.y = docks.yaml dock_pose.y - 0.126 * sin(theta)
        #
        # (theta being this file's theta, the robot's nose-forward heading
        # INTO the wall -- so subtracting along it walks back out into the
        # room). Uniform across all 8; docks.yaml stays the source of truth
        # for where the docks physically ARE.
        #
        # Why. docks.yaml's dock_pose is the arena.sdf dock model's own
        # origin, which sits ON THE INNER FACE OF THE DOCK'S BACK WALL
        # (arena.sdf: "Frame: origin at floor level on the centre of the
        # back wall's inner face"). It is a wall, not a robot pose. The
        # robot's chassis nose is 0.1231 m ahead of base_footprint
        # (base_link.stl bbox x-max 0.12260 + base_link's own +0.00046 x
        # offset, at z ~0.05 m, i.e. squarely inside the wall's 0-0.30 m
        # height band), and dock_backwards is false, so base_footprint
        # physically cannot get closer than ~0.123 m to that wall.
        #
        # Measured live, docked at dock A, both readings taken within
        # seconds of "Robot is charging!":
        #     Gazebo ground truth (gz model -p): x = 2.86604
        #     TF map->base_footprint (SLAM):     x = 2.958
        #     dock A's old configured pose:      x = 2.992
        # Ground truth standoff = 2.992 - 2.86604 = 0.1260 m, and the nose
        # tip lands at 2.8660 + 0.1231 = 2.9891, i.e. 3 mm short of the
        # wall. So there is NO Gazebo wall penetration: the chassis stops
        # against the wall exactly where the geometry says it must.
        #
        # What actually satisfied `docking_threshold: 0.05` before this
        # change was a 0.092 m LOCALIZATION ERROR: the estimate (2.958) sat
        # 9.2 cm ahead of the truth (2.866), leaving an apparent residual of
        # 2.992 - 2.958 = 0.034 m < 0.05. That error is wheel odometry
        # accumulated while the robot pushed its stalled, slipping drivetrain
        # into the wall (it keeps commanding v_linear_min until it believes
        # it has arrived). Docking "worked" on the strength of its own
        # odometry drift -- stalling the motors against a wall for several
        # seconds every single dock, with the estimate left ~9 cm wrong
        # afterwards. Hence the offset: the target is now a pose the robot
        # can actually reach, so it stops just short of contact instead of
        # pushing.
        docks: ["A", "B", "C", "D", "E", "F", "G", "H"]
        A: {type: "arena_dock", frame: "map", pose: [2.866, -1.500, 0.0], id: "0"}
        B: {type: "arena_dock", frame: "map", pose: [2.866, 1.500, 0.0], id: "1"}
        C: {type: "arena_dock", frame: "map", pose: [1.500, 2.866, 1.5708], id: "2"}
        D: {type: "arena_dock", frame: "map", pose: [-1.500, 2.866, 1.5708], id: "3"}
        E: {type: "arena_dock", frame: "map", pose: [-2.866, 1.500, 3.14159], id: "4"}
        F: {type: "arena_dock", frame: "map", pose: [-2.866, -1.500, 3.14159], id: "5"}
        G: {type: "arena_dock", frame: "map", pose: [-1.500, -2.866, -1.5708], id: "6"}
        H: {type: "arena_dock", frame: "map", pose: [1.500, -2.866, -1.5708], id: "7"}
        # Hand spot-check of the formula on a second, differently-oriented
        # dock (G, on the -Y wall, theta -pi/2, approach heading -y):
        #   pose.y = -2.992 - 0.126 * sin(-pi/2) = -2.992 + 0.126 = -2.866,
        # and the nose then lands at -2.866 - 0.1231 = -2.9891, the same
        # 3 mm short of dock G's own wall. Consistent.
        #
        # MARGIN WARNING, for whoever tunes this next: the 0.126 m offset was
        # derived from the measured CONTACT position (2.992 - 2.86604), so
        # the new target IS the wall-contact pose, not a standoff from it --
        # the nose lands 3 mm short of the wall if the robot reaches the
        # target exactly. There is therefore effectively ZERO designed
        # clearance margin, and the live residuals after the change show it:
        # 0.026 m at dock G, but 0.0478 m at dock C against a
        # `docking_threshold` of 0.05 -- 96% of the budget on one of two
        # samples. `max_retries: 3` absorbed it and 3/3 docks succeeded, so
        # this is tuned, not broken.
        #
        # So if docking starts occasionally failing to declare success while
        # physically parking fine, do NOT go looking for a broken mechanism
        # first: the honest reading is that this offset removed the
        # wall-pushing stall, not the contact, and the margin is thin by
        # construction. The two cheap levers are a slightly larger offset
        # (0.15-0.17, still inside the threshold) or a slightly larger
        # `docking_threshold` (0.07). Both are deliberately NOT applied here,
        # because the current values are the ones actually measured live.
        #
        # !!! UNVERIFIED ON REAL HARDWARE !!! This offset and the standoff
        # behind it were measured in simulation only. If docking fails to
        # reach `docking_threshold` on the physical robot, CHECK FOR
        # CHASSIS-TO-WALL CONTACT BEFORE THE THRESHOLD IS REACHED first:
        # this sim's exact contact/slip behaviour against a thin static wall
        # (and the ~0.09 m odometry drift it produced) may not reproduce,
        # and a real dock's physical geometry may differ from arena.sdf's by
        # more than the 0.05 m threshold.

        # Approach controller. Mostly opennav_docking's own defaults; the
        # collision block is spelled out explicitly because it is the only
        # obstacle protection the robot has during a docking/undocking leg.
        #
        # COLLISION DETECTION (enabled in the final-review fix wave). This
        # was `use_collision_detection: false` with a "no Nav2 costmaps in
        # this stack yet, revisit once they land" note -- they landed in
        # Task 6 and nobody revisited. It is on now, checking the projected
        # approach trajectory against Nav2's local costmap.
        #
        # This matters more here than anywhere else in the stack:
        # docking_server publishes /cmd_vel DIRECTLY during docking and
        # undocking, bypassing the velocity smoother and the standalone
        # nav2_collision_monitor that every other velocity command in this
        # stack goes through (a deliberate, documented exception -- see the
        # docstrings in perception/launch/docking.launch.py and
        # navigation/launch/navigation.launch.py). So this parameter is not
        # a redundant second layer; without it a docking leg has no
        # obstacle protection at all.
        #
        # The topics are the defaults, repeated for visibility: both are
        # published by navigation.launch.py's local_costmap in the global
        # namespace (`local_costmap:` in navigation/config/nav2_params.yaml),
        # which is where docking_server resolves these relative names too.
        #
        # dock_collision_threshold is the knob that keeps the dock itself
        # from aborting its own approach: trajectory points within this
        # distance of the dock pose are not collision-checked, which is
        # necessary because the dock's back wall and wings ARE lethal cells
        # in the local costmap by construction.
        #
        # MEASURED, not guessed (2026-10-02, live at dock A). The stock Nav2
        # default (0.3) aborted every docking attempt, through all 3
        # max_retries: "Collision detected at pose: (2.66, -1.55, 0.00) in
        # frame odom", i.e. 0.30 m from dock A's pose expressed in the same
        # frame (2.962, -1.546; map->odom was (0.030, 0.046) at the time).
        # The robot's 0.18 m footprint radius plus the local costmap's 0.3 m
        # inflation around the dock's own back wall reach that far out, so
        # the approach was flagging the dock itself as the obstacle.
        #
        # Careful with what this distance is measured FROM. It is NOT the
        # dock pose: opennav_docking's docking_server deliberately projects
        # its control target 0.25 m PAST the dock pose before handing it to
        # the controller (`const double backward_projection = 0.25;` in
        # approachDock, to keep the control law's atan2 from exploding near
        # the goal), and Controller::isTrajectoryCollisionFree skips a
        # trajectory point only when its distance to THAT projected target
        # is below this threshold. So the usable clearance in front of the
        # dock pose is (dock_collision_threshold - 0.25). That is why 0.5
        # also aborted at the exact same pose: 0.30 + 0.25 = 0.55 > 0.5.
        #
        # 0.65 therefore means "stop checking within 0.40 m of the dock
        # pose" -- 0.10 m of margin over the measured 0.30 m worst case, to
        # absorb localization jitter and the dock wings (nearest wing corner
        # is ~0.37 m from the dock pose, at a different bearing).
        #
        # What this buys and what it does not, for the DOCK APPROACH: with
        # staging 0.6 m out (staging_x_offset), the checked part of an
        # approach is the outer ~0.40-0.60 m band of the bay. An obstacle
        # INSIDE the last 0.40 m of a dock bay is not detectable this way --
        # geometrically, it is indistinguishable from the dock. That is the
        # honest limit of fixed-pose docking with a 0.6 m standoff; a larger
        # standoff or vision-corrected docking is what would shrink it.
        #
        # KNOWN, DELIBERATE SAFETY EXCEPTION: AT 0.65 THE UNDOCK REVERSE IS
        # NOT COLLISION-CHECKED AT ALL. Not "less checked" -- the check never
        # fires once during an undock. An earlier version of this comment
        # claimed the opposite ("plus the undock reverse once the robot is
        # more than 0.40 m clear"); that was wrong in both its numbers and
        # its conclusion, and this is the correction.
        #
        # Verified against opennav_docking 1.3.13's own source (the version
        # installed here; only headers ship in /opt/ros/jazzy, so
        # Controller::isTrajectoryCollisionFree and DockingServer::undockRobot
        # were read from upstream at that exact tag). The carve-out distance
        # is measured by a DIFFERENT rule depending on direction:
        #
        #   is_docking == true :  euclidean_distance(target_pose, next_pose)
        #                         -> distance to the dock target (itself
        #                            projected 0.25 m past the dock pose)
        #   is_docking == false:  std::hypot(next_pose.x, next_pose.y)
        #                         -> each projected point's distance from the
        #                            robot's CURRENT pose (next_pose is
        #                            integrated in base_frame from the
        #                            origin), recomputed every control cycle
        #
        # and the 0.25 m `backward_projection` does NOT apply to undocking --
        # it is applied only inside approachDock. So during an undock the
        # rolled-out trajectory converges on the staging pose 0.6 m away,
        # meaning no projected point is ever more than ~0.6 m from the robot,
        # meaning `dock_collision_distance > dock_collision_threshold` (0.65)
        # is never true, meaning isCollisionFree is never called. At the
        # stock 0.3 the outer part of the reverse WAS checked, so this is a
        # real protection regression introduced by the tuning above, not a
        # pre-existing gap.
        #
        # Why it is not split instead: there is no undock-specific
        # parameter to split. opennav_docking's Controller holds a single
        # `dock_collision_threshold_` (controller.hpp:134) and passes it
        # through the same comparison for both directions -- the only
        # difference is the `is_docking` flag selecting the distance rule
        # above.
        #
        # Why no single value protects both: the dock approach needs
        # >= 0.55 (the measured 0.30 m worst-case flagged distance plus the
        # 0.25 m backward_projection), and 0.65 is that plus 0.10 m of
        # margin -- 0.5 demonstrably aborted every attempt. The undock needs
        # < 0.6 to check anything at all, and materially less than that to
        # check a useful portion of a 0.6 m manoeuvre. The two windows do not
        # overlap with any margin: 0.55-0.59 would leave the approach with
        # 0.00-0.04 m over its measured worst case (i.e. back to aborting
        # through all max_retries) while still only checking the last few
        # centimetres of the undock rollout. So this is a genuine either/or,
        # and the approach -- which is the leg that failed live, repeatedly,
        # and the longer of the two -- wins.
        #
        # Why that is acceptable here, explicitly: the undock reverse is
        # 0.6 m straight back along the corridor the robot itself drove in
        # through seconds earlier, and the arena design keeps dock approach
        # corridors clear of props. It is NOT acceptable as a general
        # property of the stack. If undock-time obstacles ever become a real
        # risk (a moving robot behind us, a prop placed during the dwell),
        # the fix is NOT this threshold -- lowering it re-breaks docking.
        # The fix is to give the undock leg protection that does not share
        # this knob: route docking_server's /cmd_vel through
        # nav2_collision_monitor with a dock-aware polygon, or add a
        # rear-facing stop polygon active only during undocking.
        controller:
            use_collision_detection: true
            costmap_topic: "local_costmap/costmap_raw"
            footprint_topic: "local_costmap/published_footprint"
            transform_tolerance: 0.1
            projection_time: 5.0
            simulation_step: 0.1
            dock_collision_threshold: 0.65
            k_phi: 3.0
            k_delta: 2.0
            beta: 0.4
            lambda: 2.0
            v_linear_min: 0.1
            v_linear_max: 0.15
            v_angular_max: 0.75
            slowdown_radius: 0.25
