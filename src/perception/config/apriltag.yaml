# apriltag_ros (AprilTagNode) parameters.
#
# Detects the dock AprilTags (family 36h11, 0.100 m edge) from the OAK-D RGB
# camera. Every dock tag (ids 0-7) is the same size, so one default `size`
# covers them and the optional `tag.ids`/`tag.sizes`/`tag.frames` overrides are
# not needed.
#
# The image topic is remapped in launch/apriltag.launch.py, since apriltag_ros
# takes no topic names as parameters. camera_info is always the sibling
# `<image topic namespace>/camera_info` (image_transport).
/**:
    ros__parameters:
        # use_sim_time is set by launch/apriltag.launch.py.

        image_transport: raw     # The real driver publishes raw images.
        family: 36h11
        size: 0.100               # meters
        max_hamming: 0            # exact decode only
        qos_profile: default

        detector:
            threads: 1
            decimate: 1.0          # No decimation: tags are small and far in the arena.
            blur: 0.0
            refine: true
            sharpening: 0.25
            debug: false

        pose_estimation_method: "pnp"
