# Nav2 parameters for Modysseus, adapted from nav2_bringup's and
# nav2_collision_monitor's shipped examples (/opt/ros/jazzy/share/...).
#
# Trimmed from the stock example:
#   - amcl: slam_toolbox (localize.launch.py) already publishes map->odom. A
#     second localizer would fight it for the same TF edge.
#   - map_server: slam_toolbox's localization node publishes /map
#     (transient-local) and the static_layer subscribes to it. A second
#     publisher would race it.
#   - smoother_server, waypoint_follower, route_server, docking_server: a bare
#     NavigateToPose does not use them, and docking has its own server. Also
#     left out of the lifecycle node set in navigation.launch.py.
#
# Frames: base_footprint everywhere, never base_link. The EKF owns
# odom->base_footprint, a static transform owns base_footprint->base_link, and
# nothing else may publish either edge.
#
# Footprint: einride_mini_truck is a 6-wheel skid-steer, track 0.17452 m,
# wheelbase 0.171 m. The half-diagonal to a wheel-contact corner is
# sqrt((0.171/2)^2 + (0.17452/2)^2) =~ 0.122 m. The robot_radius below (0.23,
# see the costmaps) adds margin for chassis overhang. A circle is used
# throughout because a skid-steer rotates in place during recoveries, so a
# direction-agnostic footprint is the conservative choice.
#
# Sensors:
#   - lidar: /scan_filtered (LaserScan, LD19).
#   - camera: /oak/points_filtered (PointCloud2), not the vendor's raw
#     /oak/points. perception's oak_points_filter builds an XYZ cloud from the
#     OAK-D depth image (perception/launch/oak_points_filter.launch.py)
#     because the 29.5 MB raw cloud starved the collision monitor's camera
#     source. The camera publishes 320x240 unaligned depth, so that cloud is
#     76,800 points and needs no downsampling. The camera does not see the robot, so nothing near the body is
#     cropped and obstacle_min_range is 0.0.
#
#     min_obstacle_height / min_height is 0.05 m: not 0.1 m, which made the
#     robot blind to real low obstacles, and not 0.0 / 0.02, which reproduced
#     the planner instability. Floor-plane depth noise across the camera's
#     field of view got marked and perturbed the path on every 1 Hz replan.
#     0.05 m is well below any obstacle worth avoiding (cable, curb, pallet lip).

controller_server:
  ros__parameters:
    # 10 Hz, not 20: CPU-only MPPI managed a median ~11 Hz (3-15 Hz) when asked
    # for 20, holding each command 70-280 ms and moving the robot in jerky
    # steps. velocity_smoother (20 Hz) fills in between.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.2 # was 0.2

    # The rotation shim wraps MPPI: on a new path it first pivots to the path's
    # heading, then hands over, so MPPI's samples do not fight a large heading
    # error on a skid-steer. The wrapped controller's parameters share this
    # "FollowPath" namespace. Engages above ~34 deg, releases below ~17 deg.
    # rotate_to_heading_once is false so the robot pivots at every sharp
    # corner instead of arcing (a skid-steer barely turns on small wz); replans
    # now only happen when the path becomes invalid. The wz values were 1.5
    # tuned for the MCU's own kinematics; at 1.0 pivots barely moved the real
    # robot because wheel scrub needs a large differential first.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.3
      rotate_to_heading_once: false
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1
      max_angular_accel: 0.5 # was 3.0
      simulate_ahead_time: 1.0
      # closed_loop false: closed loop ramps from the measured turn rate, which
      # is ~0 until a skid-steer breaks loose, so the command stuck at
      # ~0.15 rad/s. Open loop ramps from the last command instead.
      closed_loop: false  # TODO: test
      # rotate_to_goal_heading true: inside xy_goal_tolerance, pivot to the goal
      # heading. MPPI cannot fix heading without driving, so it shuffled back
      # and forth at every pre-dock pose.
      rotate_to_goal_heading: true

      # --- nav2_mppi_controller::MPPIController params (wrapped above) ---
      # Cost per cycle is batch_size x time_steps. 28 x 0.1 s keeps the 2.8 s
      # horizon of the old 56 x 0.05 s, and model_dt matches the 10 Hz
      # controller_frequency as MPPI recommends. With 500 samples instead of
      # 1000 that is a quarter of the work per cycle.
      time_steps: 28
      model_dt: 0.1
      batch_size: 500
      vx_max: 0.3
      vx_min: -0.15
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 1
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # Debug only: the trajectory MarkerArray costs real compute on the
      # GPU-less Jetson. Set true temporarily when tuning critics.
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0   # was 3.81: hold a bigger margin from obstacles
        near_collision_cost: 253
        critical_cost: 300.0
        # false, not true: with a radius-only footprint (robot_radius below,
        # no polygon), Costmap2DROS does not populate a footprint the
        # critic can use - "true" here throws
        # "Considering footprint in collision checking but no robot
        # footprint provided in the costmap" out of configure() and aborts
        # the whole lifecycle bringup (found during this task's own
        # verification run). CostCritic still checks the costmap cost at
        # the robot's center either way; per-point footprint checking is
        # handled instead by inflation_layer's cost gradient sized around
        # robot_radius.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      # Smac 2D (A* then smoothed) instead of NavFn, which weighs inflation
      # lightly and hugged obstacles. cost_travel_multiplier scales how much a
      # cell's cost adds to travel cost (default 2.0): higher keeps further from
      # obstacles but refuses narrow gaps.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3
      # false: only plan through cells known to be free.
      allow_unknown: false
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    # The EKF's fused estimate; consumers of the corrected estimate must use
    # this topic.
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # NavigateToPose BT: navigation.launch.py sets Nav2's
    # navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml. The
    # default replans every second and flips between near-equal routes around
    # an obstacle, so the robot hesitated. This one keeps the path until it is
    # blocked or the goal changes, with the same recoveries.
    # NavigateThroughPoses keeps its default BT.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.5]
    min_velocity: [-0.15, 0.0, -1.5]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Last stage before the wheels: reads velocity_smoother's cmd_vel_smoothed and
# writes cmd_vel_ctrl for wheel_drive_node (both set in navigation.launch.py).
# Zones are centred on base_footprint and sized to the footprint, not just the
# front, since a skid-steer may need to stop while rotating or reversing.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    # 30x30 cm square around the 23x26 cm body: stops only when something is
    # within ~2-3.5 cm of the chassis, so it cannot trap the robot mid-path.
    PolygonStop:
      type: "polygon"
      points: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    # Circle r=0.3, not a +-0.4 square (0.57 m at the corners): the square
    # halved every command near walls, below what the skid-steer needs to
    # move. MPPI's CostCritic already slows near obstacles.
    PolygonSlow:
      type: "circle"
      radius: 0.3
      action_type: "slowdown"
      min_points: 4
      # 0.75, not 0.5: the slowdown scales the turn rate too, and halving it
      # near walls left pivots too weak to move the robot.
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["scan", "oak_cloud"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      min_height: 0.05
      max_height: 1.0
      enabled: true
    oak_cloud:
      type: "pointcloud"
      # Filtered, not raw /oak/points (see the header and
      # perception/launch/oak_points_filter.launch.py). min_height 0.05 is a
      # floor-noise margin; a near-zero value reproduced the instability.
      topic: "/oak/points_filtered"
      min_height: 0.05
      # 0.35 m cutoff (base_footprint) = midway between robot top (0.30 m with
      # antenna) and lowest overhead to pass under (0.40 m): table tops ignored,
      # legs still seen. Keep equal in all three oak_cloud height limits.
      max_height: 0.35
      # The camera is the only sensor that sees obstacles below the lidar plane
      # (12 cm), so keep it on. A source with no fresh data makes the monitor
      # stop the robot ("invalid source"); source_timeout below allows for the
      # measured gaps. If stops return, check `ros2 topic hz
      # /oak/points_filtered` before turning it off.
      enabled: true
      # Per-source override of the node-level 1.0 s; the lidar keeps 1.0. The
      # camera is the supplementary source, and its gaps were measured over
      # 100 s of navigation:
      #
      #   /oak/points_filtered   median 0.099 s   p95 0.396 s   max 0.990 s
      #   /oak/points (upstream)  median 0.099 s   p95 0.429 s   max 1.255 s
      #
      # (Measured before the camera moved to 320x240 unaligned depth and the
      # voxel filter was removed; re-measure `ros2 topic hz` before tightening.)
      # The excursions came from /oak/points, then a 29.5 MB hop upstream of
      # perception's chain. 2.0 s clears the 1.255 s worst case with ~0.75 s margin; 1.5 s kept
      # firing. A briefly stale cloud is safe here: `base_shift_correction:
      # true` re-projects it through TF at its stamp, so only moving obstacles
      # add error, and the arena's are static. Dropping the source instead
      # caused a spurious "Robot to stop due to invalid source" several times
      # a minute.
      source_timeout: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # (chassis circumradius ~0.15 m + localization error).
      robot_radius: 0.18
      plugins: ["lidar_layer", "camera_layer", "inflation_layer"]
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan_filtered"
          sensor_frame: ""
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "oak_cloud"
        oak_cloud:
          # Filtered, not raw /oak/points - see this file's header comment
          # and perception/launch/oak_points_filter.launch.py. The CropBox
          # filter there removes the camera's self-detection noise at the
          # source (a region sized to the robot's own body/camera-mount
          # geometry, obstacle_min_range stays 0.0 here because of it).
          # min_obstacle_height 0.05 is a separate, modest floor-plane-noise
          # margin (see this file's header comment for why a near-zero
          # value here reproduced the same instability even with the crop
          # filter in place) - still far below any real low obstacle worth
          # avoiding, not the aggressive 0.1 m global cut an earlier
          # iteration used.
          topic: "/oak/points_filtered"
          sensor_frame: ""
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          # 0.35 m cutoff (base_footprint) = midway between robot top (0.30 m with
          # antenna) and lowest overhead to pass under (0.40 m): table tops ignored,
          # legs still seen. Keep equal in all three oak_cloud height limits.
          max_obstacle_height: 0.35
          obstacle_max_range: 1
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
      # Wide, gentle gradient so the planner prefers open space over narrow
      # gaps: cost = 252 * exp(-3 * (d - 0.23)) gives ~204 at 0.3 m from an
      # obstacle, ~112 at 0.5 m, ~83 at 0.6 m. Was 5.0 (~138 / ~50 / ~30,
      # at the old 0.18 m radius):
      # NavFn weighs cost only lightly, so paths still hugged obstacles and
      # the robot's pose error put it inside the inscribed radius. A smaller
      # factor decays slower, i.e. keeps cost high further out, without
      # growing the inflated zone (docks are 0.3 m apart).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 0.23, was 0.18: the planner and MPPI treat everything closer than this
      # to an obstacle as forbidden for the robot's centre, so this is the hard
      # clearance (chassis circumradius ~0.15 m + localization error).
      robot_radius: 0.23
      # Matches arena_real.yaml's own resolution (src/localization/maps/arena_real.yaml)
      # so the static layer never has to resample the saved map.
      resolution: 0.025
      track_unknown_space: true
      plugins: ["static_layer", "lidar_layer", "camera_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan_filtered"
          sensor_frame: ""
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "oak_cloud"
        oak_cloud:
          # Filtered, not raw /oak/points - see this file's header comment
          # and perception/launch/oak_points_filter.launch.py. The CropBox
          # filter there removes the camera's self-detection noise at the
          # source (a region sized to the robot's own body/camera-mount
          # geometry, obstacle_min_range stays 0.0 here because of it).
          # min_obstacle_height 0.05 is a separate, modest floor-plane-noise
          # margin (see this file's header comment for why a near-zero
          # value here reproduced the same instability even with the crop
          # filter in place) - still far below any real low obstacle worth
          # avoiding, not the aggressive 0.1 m global cut an earlier
          # iteration used.
          topic: "/oak/points_filtered"
          sensor_frame: ""
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          # 0.35 m cutoff (base_footprint) = midway between robot top (0.30 m with
          # antenna) and lowest overhead to pass under (0.40 m): table tops ignored,
          # legs still seen. Keep equal in all three oak_cloud height limits.
          max_obstacle_height: 0.35
          obstacle_max_range: 1
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
      # Wide, gentle gradient so the planner prefers open space over narrow
      # gaps: cost = 252 * exp(-3 * (d - 0.23)) gives ~204 at 0.3 m from an
      # obstacle, ~112 at 0.5 m, ~83 at 0.6 m. Was 5.0 (~138 / ~50 / ~30,
      # at the old 0.18 m radius):
      # NavFn weighs cost only lightly, so paths still hugged obstacles and
      # the robot's pose error put it inside the inscribed radius. A smaller
      # factor decays slower, i.e. keeps cost high further out, without
      # growing the inflated zone (docks are 0.3 m apart).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: true
