# Nav2 parameters for Modysseus, adapted from nav2_bringup's own shipped
# example (/opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml) and the
# collision_monitor package's own shipped example
# (/opt/ros/jazzy/share/nav2_collision_monitor/params/collision_monitor_params.yaml).
#
# Deliberately NOT included (trimmed from the stock example):
#   - amcl: slam_toolbox (Task 3, localize.launch.py) already publishes
#     map->odom from a saved pose graph. A second localizer would fight it
#     for the same TF edge, exactly the two-publisher TF problem Task 1 hit
#     and documented for odom->base_footprint.
#   - map_server: slam_toolbox's localization node already publishes /map
#     (transient-local), which the static_layer below subscribes to
#     directly. A second map_server publishing the same topic would race it.
#   - smoother_server, waypoint_follower, route_server, docking_server: not
#     needed for a bare NavigateToPose (the default
#     navigate_to_pose_w_replanning_and_recovery.xml BT references none of
#     their actions/services) and out of this task's scope (docking already
#     has its own server from Task 5). Left out of the lifecycle node set in
#     navigation.launch.py too, rather than carried as dead config.
#
# Frames: base_footprint everywhere (never base_link) - the binding TF
# architecture decision from Task 1's report: the sim's own diff-drive
# plugin owns odom->base_footprint, robot_state_publisher owns the static
# base_footprint->base_link, and nothing else may publish either edge.
#
# Footprint: einride_mini_truck is a 6-wheel skid-steer, track 0.17452 m,
# wheelbase 0.171 m (vendor docs / earlier task notes). Half-diagonal from
# the base_footprint origin to a wheel-contact corner is
# sqrt((0.171/2)^2 + (0.17452/2)^2) =~ 0.122 m; robot_radius (now 0.23, see costmaps) below
# adds a conservative ~0.06 m margin for the chassis body/bumper overhang
# the wheel-only geometry doesn't capture, without tuning tightly (out of
# scope per the brief - this only needs to work reliably, not quickly).
# A circular footprint (radius, not a polygon) is used throughout: a
# skid-steer turns by sliding wheels sideways and is expected to rotate
# in place during recovery behaviors, so a direction-agnostic footprint is
# the conservative choice over a tight rectangle.
#
# Sensors (from einride_mini_truck_bringup/launch/simulation.launch.py and
# einride_mini_truck_description's model.sdf):
#   - lidar: /scan_filtered (sensor_msgs/LaserScan, LD19 2D lidar)
#   - camera: /oak/points_filtered (sensor_msgs/PointCloud2), NOT the raw
#     /oak/points simulation.launch.py's point_cloud_xyzrgb_node builds from
#     the OAK-D Lite's depth+colour streams. Verified during this task's own
#     testing that the raw cloud carries self-detection/near-field noise
#     within a few cm of the robot's own origin - marking phantom
#     "obstacles" right around the robot corrupted the planner's path and
#     stalled the controller entirely (see git history / task report for
#     the full failure mode). The fix belongs in `perception`, not here: a
#     pcl_ros CropBox filter
#     (perception/launch/oak_points_filter.launch.py +
#     perception/config/oak_points_filter.yaml) removes only points inside
#     a region sized to the robot's own known body + camera mount geometry
#     (verified empirically during this task's testing to need ~0.8 m
#     across, not just the chassis footprint - see that file's own comment
#     for why), republishing everything else untouched as
#     /oak/points_filtered. obstacle_min_range below is back down to 0.0 -
#     the crop filter, not a range floor here, is what excludes the robot's
#     own body now.
#
#     min_obstacle_height/min_height below is a modest 0.05 m, not the 0.1 m
#     an earlier iteration of this file used globally, and NOT 0.0/0.02:
#     with the crop filter handling self-detection, retesting at a
#     near-0 m floor (matching nav2_bringup's own stock LaserScan example)
#     reproduced the same instability/never-progresses symptom again,
#     traced to ordinary floor-plane depth-sensor noise elsewhere in the
#     camera's field of view (not just around the robot) still getting
#     marked and perturbing the planner's path on every 1 Hz replan. 0.05 m
#     is a standard, modest floor against that near-universal depth-camera
#     characteristic - well below any real low obstacle worth avoiding
#     (a cable, a curb, a pallet lip), so it does not reintroduce the
#     original blind-to-real-obstacles problem a 0.1 m global cut did.

controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz, not 20: on the Jetson MPPI (CPU only) managed a median ~11 Hz
    # (3-15 Hz seen) while asked for 20, so each command was held for a
    # variable 70-280 ms and the robot moved in jerky steps. A rate it can
    # keep gives steady commands; velocity_smoother (20 Hz) fills in between.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2

    # Rotation shim wraps MPPI: on a new path it rotates in place to face the
    # path's initial heading first, then hands off to MPPI for the rest of
    # the follow - avoids MPPI's sampled trajectories fighting a large
    # initial heading error on a skid-steer base. Per Nav2's own pattern,
    # the wrapped controller's parameters live in this SAME "FollowPath"
    # namespace alongside the shim's own - RotationShimController
    # instantiates primary_controller under this same plugin name.
    # Engage above ~34 deg, release below ~17 deg. rotate_to_heading_once is
    # false: the robot should pivot at every sharp corner, not try to arc
    # through it with MPPI (a skid-steer barely turns on small wz). It used to
    # be true to stop ~1 s replans re-triggering pivots; replanning now only
    # happens when the path becomes invalid (see bt_navigator below).
    # rotate_to_heading_angular_vel 1.5 and wz_max 1.5: at 1.0 the pivots and
    # arcs on the real robot barely moved it (wheel scrub needs a large
    # differential before the chassis turns at all).
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.3
      rotate_to_heading_once: false
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0
      # closed_loop false: the shim otherwise ramps each command from the
      # MEASURED turn rate (odometry) plus max_angular_accel * dt. A
      # skid-steer that has not broken loose yet measures ~0, so the command
      # stuck at ~0.15 rad/s and the robot barely turned. Open loop ramps from
      # the last command instead and reaches rotate_to_heading_angular_vel.
      closed_loop: false
      # rotate_to_goal_heading true: once inside xy_goal_tolerance, pivot in
      # place to the goal heading. MPPI cannot fix heading there without
      # driving (no sideways motion), so it shuffled back and forth for a long
      # time at every staging (pre-dock) pose.
      rotate_to_goal_heading: true

      # --- nav2_mppi_controller::MPPIController params (wrapped above) ---
      # Cost per cycle is batch_size x time_steps. 28 x 0.1 s keeps the same
      # 2.8 s horizon as the old 56 x 0.05 s with half the steps, and
      # model_dt matches the 10 Hz controller_frequency as MPPI recommends.
      # With 500 samples instead of 1000 that is a quarter of the work per
      # cycle, and half as many cycles per second.
      time_steps: 28
      model_dt: 0.1
      batch_size: 500
      vx_max: 0.3
      vx_min: -0.15
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 1.5
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # Debug-only: publishes the candidate-trajectory MarkerArray at the
      # 20 Hz controller rate, which is real compute on the target Jetson
      # Orin Nano (no GPU) for something only a human watching RViz ever
      # reads. Set true temporarily when tuning critics.
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0   # was 3.81: hold a bigger margin from obstacles
        near_collision_cost: 253
        critical_cost: 300.0
        # false, not true: with a radius-only footprint (robot_radius below,
        # no polygon), Costmap2DROS does not populate a footprint the
        # critic can use - "true" here throws
        # "Considering footprint in collision checking but no robot
        # footprint provided in the costmap" out of configure() and aborts
        # the whole lifecycle bringup (found during this task's own
        # verification run). CostCritic still checks the costmap cost at
        # the robot's center either way; per-point footprint checking is
        # handled instead by inflation_layer's cost gradient sized around
        # robot_radius.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      # Smac 2D (A* on the costmap grid, then smoothed) instead of NavFn:
      # NavFn weighs inflation cost only lightly and hugged obstacles.
      # cost_travel_multiplier scales how much a cell's cost adds to the
      # travel cost (default 2.0, 4.0 here; higher = keeps further from obstacles,
      # at the price of refusing narrow gaps).
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3
      # false: only plan through cells known to be free.
      allow_unknown: false
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    # Fused estimate (Task 1's EKF), per the standing rule that anything
    # wanting the corrected estimate must consume this topic - the EKF
    # deliberately does not publish any TF (publish_tf: false), so there is
    # no odom->base_footprint edge to prefer instead.
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # NavigateToPose BT: set by navigation.launch.py to Nav2's shipped
    # navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml.
    # The default BT replans every second, and NavFn flips between two
    # near-equal routes around an obstacle, so the robot hesitated and
    # switched routes mid-drive. This one keeps the path until it is blocked
    # or the goal changes; same spin/wait/backup recoveries.
    # NavigateThroughPoses keeps the default
    # navigate_through_poses_w_replanning_and_recovery.xml.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.5]
    min_velocity: [-0.15, 0.0, -1.5]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Last stage before /cmd_vel. Input is velocity_smoother's output
# (cmd_vel_smoothed, wired up in navigation.launch.py); output is the real
# /cmd_vel the sim's diff-drive plugin consumes. Stop/slowdown zones are
# centred on base_footprint and sized relative to the footprint above
# (robot_radius 0.18) rather than only covering the front, since a
# skid-steer can need to stop while rotating in place or reversing during a
# recovery behavior, not only while driving forward.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    # 30x30 cm square around the 23x26 cm body: stops only when something is
    # within ~2-3.5 cm of the chassis, so it cannot trap the robot mid-path.
    PolygonStop:
      type: "polygon"
      points: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    # Circle r=0.3, not a +-0.4 square (0.57 m at the corners): the square
    # halved every command near walls, often below what the skid-steer needs
    # to move at all. MPPI's CostCritic already slows near obstacles.
    PolygonSlow:
      type: "circle"
      radius: 0.3
      action_type: "slowdown"
      min_points: 4
      # 0.75, not 0.5: the slowdown scales the turn rate too, and halving it
      # near walls left pivots too weak to move the robot.
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["scan", "oak_cloud"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      min_height: 0.05
      max_height: 1.0
      enabled: true
    oak_cloud:
      type: "pointcloud"
      # Filtered, not raw /oak/points - see this file's header comment and
      # perception/launch/oak_points_filter.launch.py. min_height 0.05 is a
      # modest floor-plane-noise margin, not the self-detection fix (the
      # CropBox filter handles that upstream) - see the header comment for
      # why a near-zero value here reproduced the same instability.
      topic: "/oak/points_filtered"
      min_height: 0.05
      max_height: 1.0
      # On again: the camera is the only sensor that sees obstacles shorter
      # than the lidar's plane (12 cm above the floor), so without it a low
      # obstacle is invisible to the stop and slowdown zones. It had been off
      # while the cloud was stalling (a source with no fresh data makes the
      # monitor stop the robot, "invalid source"); source_timeout below allows
      # for the measured gaps. If the stops come back, look at the cloud's rate
      # (`ros2 topic hz /oak/points_filtered`) before turning this off again.
      enabled: true
      # Per-source override of the node-level `source_timeout: 1.0` above.
      # The lidar `scan` source deliberately KEEPS 1.0 - this loosening
      # applies only to the camera, which is the supplementary source (low
      # obstacles the 2D lidar cannot see), never the primary one.
      #
      # Justified by measurement, not guessed, and only AFTER the real
      # latency cause was fixed upstream. The camera cloud's own inter-message
      # gap, sampled in sim time at a subscriber over 100 s of continuous
      # navigation (which is exactly what the monitor compares its clock
      # against):
      #
      #   /oak/points_filtered   median 0.099 s   p95 0.396 s   max 0.990 s
      #   /oak/points (upstream)  median 0.099 s   p95 0.429 s   max 1.255 s
      #
      # The excursions come from /oak/points, i.e. from the ONE remaining
      # 29.5 MB/message hop in the chain: the 1280x720 organized cloud
      # depth_image_proc builds in the vendor sim's own simulation.launch.py,
      # upstream of anything this repo launches (perception's filter chain now
      # voxel-downsamples immediately, see
      # perception/config/oak_points_filter.yaml). 2.0 s clears the measured
      # 1.255 s worst case with ~0.75 s of margin; 1.5 s would have left only
      # 0.25 s and kept firing.
      #
      # Why tolerating a briefly-stale camera cloud is safe HERE specifically:
      # `base_shift_correction: true` above means the monitor re-projects an
      # old cloud into the current base frame through TF at the message stamp
      # rather than reusing it naively, so robot motion since the stamp is
      # compensated and the residual error is only from MOVING obstacles -
      # and the arena's obstacles are static. Set against that, the behaviour
      # this replaces was strictly worse than a slightly stale cloud: the
      # monitor discarded the source entirely (no camera input at all) and,
      # with no valid source left, additionally commanded "Robot to stop due
      # to invalid source" - a spurious stop, several times a minute.
      source_timeout: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 0.23, was 0.18: the planner and MPPI treat everything closer than this
      # to an obstacle as forbidden for the robot's centre, so this is the hard
      # clearance (chassis circumradius ~0.15 m + localization error).
      robot_radius: 0.23
      plugins: ["lidar_layer", "camera_layer", "inflation_layer"]
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan_filtered"
          sensor_frame: ""
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "oak_cloud"
        oak_cloud:
          # Filtered, not raw /oak/points - see this file's header comment
          # and perception/launch/oak_points_filter.launch.py. The CropBox
          # filter there removes the camera's self-detection noise at the
          # source (a region sized to the robot's own body/camera-mount
          # geometry, obstacle_min_range stays 0.0 here because of it).
          # min_obstacle_height 0.05 is a separate, modest floor-plane-noise
          # margin (see this file's header comment for why a near-zero
          # value here reproduced the same instability even with the crop
          # filter in place) - still far below any real low obstacle worth
          # avoiding, not the aggressive 0.1 m global cut an earlier
          # iteration used.
          topic: "/oak/points_filtered"
          sensor_frame: ""
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
      # Wide, gentle gradient so the planner prefers open space over narrow
      # gaps: cost = 252 * exp(-3 * (d - 0.23)) gives ~204 at 0.3 m from an
      # obstacle, ~112 at 0.5 m, ~83 at 0.6 m. Was 5.0 (~138 / ~50 / ~30,
      # at the old 0.18 m radius):
      # NavFn weighs cost only lightly, so paths still hugged obstacles and
      # the robot's pose error put it inside the inscribed radius. A smaller
      # factor decays slower, i.e. keeps cost high further out, without
      # growing the inflated zone (docks are 0.3 m apart).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 0.23, was 0.18: the planner and MPPI treat everything closer than this
      # to an obstacle as forbidden for the robot's centre, so this is the hard
      # clearance (chassis circumradius ~0.15 m + localization error).
      robot_radius: 0.23
      # Matches arena.yaml's own resolution (src/localization/maps/arena.yaml)
      # so the static layer never has to resample the saved map.
      resolution: 0.025
      track_unknown_space: true
      plugins: ["static_layer", "lidar_layer", "camera_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan_filtered"
          sensor_frame: ""
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "oak_cloud"
        oak_cloud:
          # Filtered, not raw /oak/points - see this file's header comment
          # and perception/launch/oak_points_filter.launch.py. The CropBox
          # filter there removes the camera's self-detection noise at the
          # source (a region sized to the robot's own body/camera-mount
          # geometry, obstacle_min_range stays 0.0 here because of it).
          # min_obstacle_height 0.05 is a separate, modest floor-plane-noise
          # margin (see this file's header comment for why a near-zero
          # value here reproduced the same instability even with the crop
          # filter in place) - still far below any real low obstacle worth
          # avoiding, not the aggressive 0.1 m global cut an earlier
          # iteration used.
          topic: "/oak/points_filtered"
          sensor_frame: ""
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
      # Wide, gentle gradient so the planner prefers open space over narrow
      # gaps: cost = 252 * exp(-3 * (d - 0.23)) gives ~204 at 0.3 m from an
      # obstacle, ~112 at 0.5 m, ~83 at 0.6 m. Was 5.0 (~138 / ~50 / ~30,
      # at the old 0.18 m radius):
      # NavFn weighs cost only lightly, so paths still hugged obstacles and
      # the robot's pose error put it inside the inscribed radius. A smaller
      # factor decays slower, i.e. keeps cost high further out, without
      # growing the inflated zone (docks are 0.3 m apart).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: true
