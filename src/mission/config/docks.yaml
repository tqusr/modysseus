# Arena dock poses in the `map` frame of the saved pose graph.
#
# dock_pose.theta is the tag's outward normal (room-ward). This is the mission
# schema, used only for the NavigateToPose pre-dock step. opennav_docking wants
# the opposite heading (theta + pi), so perception/config/docking.yaml stores
# different thetas for the same docks. Do not copy numbers between the files.
#
# staging_pose is the robot d = 0.75 m out along the normal, facing the dock
# (the middle of perception's 0.5-1.0 m pre-dock box):
#   x     = dock_pose.x + d * cos(dock_pose.theta)
#   y     = dock_pose.y + d * sin(dock_pose.theta)
#   theta = dock_pose.theta + pi   (normalized to (-pi, pi])
#
# Checked in simulation for dock A: tag 0 was visible, centred and decoded
# exactly from the computed staging pose. The other seven use the same formula.
docks:
  A: {tag_id: 0, dock_pose: {x: 1.494, y: -1.651, theta: 2.60305}, staging_pose: {x: 0.850, y: -1.267, theta: -0.53854}}
  B: {tag_id: 1, dock_pose: {x: 4.795, y: -6.508, theta: 1.93484}, staging_pose: {x: 4.528, y: -5.807, theta: -1.20675}}
  C: {tag_id: 2, dock_pose: {x: 4.306, y: -5.759, theta: 1.96332}, staging_pose: {x: 4.019, y: -5.066, theta: -1.17827}}
  D: {tag_id: 3, dock_pose: {x: 1.131, y: 0.016, theta: 3.11728}, staging_pose: {x: 0.382, y: 0.034, theta: -0.02431}}
  E: {tag_id: 4, dock_pose: {x: 1.974, y: -0.107, theta: 2.64375}, staging_pose: {x: 1.315, y: 0.251, theta: -0.49785}}
  F: {tag_id: 5, dock_pose: {x: 5.408, y: -7.741, theta: 3.12494}, staging_pose: {x: 4.658, y: -7.728, theta: -0.01665}}
  G: {tag_id: 6, dock_pose: {x: 2.222, y: -5.076, theta: 1.36322}, staging_pose: {x: 2.376, y: -4.342, theta: -1.77837}}
  H: {tag_id: 7, dock_pose: {x: 1.004, y: -1.242, theta: 2.22026}, staging_pose: {x: 0.550, y: -0.645, theta: -0.92133}}
