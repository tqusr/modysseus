# Arena dock poses in the `map` frame of the saved pose graph.
#
# dock_pose.theta is the tag's outward normal (room-ward). This is the mission
# schema, used only for the NavigateToPose pre-dock step. opennav_docking wants
# the opposite heading (theta + pi), so perception/config/docking.yaml stores
# different thetas for the same docks. Do not copy numbers between the files.
#
# staging_pose is the robot d = 0.75 m out along the normal, facing the dock
# (the middle of perception's 0.5-1.0 m pre-dock box):
#   x     = dock_pose.x + d * cos(dock_pose.theta)
#   y     = dock_pose.y + d * sin(dock_pose.theta)
#   theta = dock_pose.theta + pi   (normalized to (-pi, pi])
#
# Checked in simulation for dock A: tag 0 was visible, centred and decoded
# exactly from the computed staging pose. The other seven use the same formula.
docks:
  A: {tag_id: 0, dock_pose: {x: 3.161, y: 0.886, theta: 3.10119}, staging_pose: {x: 2.412, y: 0.916, theta: -0.0404}}
  B: {tag_id: 1, dock_pose: {x: 3.213, y: -0.484, theta: -3.07744}, staging_pose: {x: 2.465, y: -0.532, theta: 0.06415}}
  C: {tag_id: 2, dock_pose: {x: 2.036, y: -0.768, theta: 1.61993}, staging_pose: {x: 1.999, y: -0.019, theta: -1.52166}}
