slam_toolbox:
  # Filename says "async" for historical reasons (this started as the async
  # example config), but mapping.launch.py now points sync_slam_toolbox_node
  # at this same file - see that launch file's docstring for why. The
  # parameter schema is identical between the two node variants.
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    #
    # base_frame is base_footprint, not base_link: Gazebo's DiffDrive plugin
    # owns odom->base_footprint dynamically, and robot_state_publisher owns a
    # static base_footprint->base_link, so base_link already has one parent -
    # see Task 1's review (2026-10-02-full-stack plan) for why this is the
    # only valid choice, not base_link.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization
    use_sim_time: true

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.025
    restamp_tf: false
    # LD19P vendor-documented range is 0.02-12 m; the shipped example's
    # 0.0-20.0 would let slam_toolbox raster returns from well past what the
    # sensor can actually see.
    min_laser_range: 0.02 #for rastering images
    max_laser_range: 12.0 #for rastering images
    minimum_time_interval: 0.5
    # Bumped from 0.2s: this sim has two ros_gz_bridge publishers on /clock,
    # producing small millisecond-scale time jumps (confirmed in Task 1's
    # review as "harmless" for the EKF, which only logged warnings, but for
    # a node doing frequent TF lookups with a tight timeout over a multi-
    # minute mapping run, those jumps caused real tf2::NoDataForExtrapolation
    # crashes and - even when it didn't crash - plausibly caused occasional
    # bad scan matches that produced severely distorted maps (13-15m instead
    # of the real ~6m arena), since a dropped/late transform lookup can make
    # slam_toolbox fall back to a worse pose guess for that scan. A more
    # tolerant timeout lets it ride out the jitter instead of either crashing
    # or silently degrading match quality.
    transform_timeout: 1.0
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    # Reduced from 0.5 rad (~28.6 deg): with do_loop_closing disabled (see
    # below), a single weak link in the scan-matching chain can never be
    # corrected afterward. The waypoint drive does several near-in-place
    # rotations of 90+ degrees; at the old 0.5 rad threshold, slam_toolbox
    # could skip straight past a large chunk of that rotation before
    # inserting its next keyframe, leaving too little scan overlap with the
    # previous one for a reliable match in this symmetric room - observed
    # as a reproducible failure signature (map stretching to 13-15m instead
    # of the real ~6m arena, always breaking around the same early turn).
    # A tighter heading threshold forces more keyframes during rotation,
    # keeping consecutive scans close enough to match reliably.
    minimum_travel_heading: 0.15
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    # Disabled: this arena is a small (6x6 m), highly symmetric square room
    # with docks placed symmetrically on every wall. During actual mapping
    # runs, loop closure repeatedly produced bad matches between
    # perceptually-similar-but-different corners/walls, which the pose-graph
    # optimizer then "resolved" by teleporting a large chunk of the map tens
    # of meters away (confirmed via a quick occupied-cell bounding-box check
    # on /map - a good run stays within the known ~6x6 m extent, a bad one
    # spans 15-20+ m). Frame-to-frame scan matching alone (use_scan_matching)
    # is enough to track a single short mapping pass around a room this
    # small; loop closure's main benefit (correcting drift over long/large
    # trajectories) isn't needed here and its false-positive risk in a
    # symmetric room outweighs it.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    # Widened from 0.5m: the scan matcher only searches within this window
    # around the pose odometry predicts. A direct ground-truth check (gz's
    # /world/demo/pose/info vs /odom, static after an in-place rotation)
    # found odom's yaw matched true sim yaw to within 0.07deg - ruling out a
    # systematic odometry angular-scale error as the cause of the repeated
    # 13-15m map distortion seen in this investigation. But a narrow window
    # is still fragile to any transient pose-seed error (e.g. from the known
    # dual-/clock jitter affecting a scan's TF lookup mid-rotation even if
    # odometry itself is fine once settled), and in a room this symmetric a
    # narrow window that misses the true pose has nothing nearby-but-wrong
    # to fall back on except another wall/dock that looks similar. Widening
    # the search space gives the matcher room to find the true match even
    # when the odometry-seeded center is off by more than 0.5m.
    correlation_search_space_dimension: 2.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
