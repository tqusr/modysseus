# ekf_filter_node: fuses wheel odometry (/odom) and the bias-corrected gyro
# (/imu/corrected, from gyro_bias_node) into /odometry/filtered.
# Plan: docs/superpowers/plans/2026-10-03-imu-wheel-odometry-fusion.md
#
# Fused (velocities only; the EKF integrates them into the pose):
#   - Wheels: forward speed (vx) and "no sideways motion" (vy = 0 for a
#     skid-steer). Encoders measure distance well.
#   - Gyro: turn rate (vyaw) only. Skid-steer scrub makes the wheels measure
#     rotation badly. The gyro's drift is removed upstream by gyro_bias_node.
#
# Not fused:
#   - Wheel pose (x, y, yaw): the integral of the same wheel velocities, so it
#     counts the wheels twice and its heading would fight the gyro.
#   - Wheel yaw rate: measured badly, would fight the gyro.
#   - IMU orientation: the MCU sends raw rates only (REP-145,
#     orientation_covariance[0] = -1).
#   - Accelerometer: removing gravity needs the robot's tilt, which is not
#     available, so tilt would leak into forward acceleration.
#
# Clock and TF come from localization.launch.py: use_sim_time false and
# publish_tf true. This node owns odom->base_footprint, and
# hardware_odometry.launch.py turns wheel_odometry_node's TF off. Two
# publishers of one edge cause TF_OLD_DATA warnings and "Failed to meet update
# rate" errors. slam_toolbox reads this TF.
#
# Frames: /odom has child_frame_id base_footprint (not base_link) and a static
# base_footprint->base_link is broadcast, so base_link_frame is base_footprint.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    sensor_timeout: 0.1
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: imu/corrected
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10

    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true
