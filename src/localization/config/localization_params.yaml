slam_toolbox:
  # Localization params for slam_toolbox, adapted from the shipped
  # mapper_params_localization.yaml (which leaves `mode: mapping` set).
  #
  # `map_file_name` is not set here: launch/localize.launch.py injects it as an
  # absolute path under the package share's maps/ directory. Note:
  #
  # 1. It is not the nav2_map_server pair (<map>.yaml and <map>.pgm).
  #    Localization mode loads a serialized pose graph, <map>.posegraph plus
  #    <map>.data (an internal karto format). Without them the node does not
  #    work as a localizer, which is easy to mistake for a lifecycle race.
  # 2. When re-mapping, regenerate both pairs (map_saver_cli and serialize_map)
  #    from the same live mapping run, back-to-back on the one slam_toolbox
  #    instance. The Nav2 costmap loads <map>.yaml and this localizer loads
  #    <map>.posegraph, and they must agree on where walls and docks are. With
  #    `do_loop_closing: false` two independent passes drift differently even
  #    from the same start pose, and no self-consistency check catches that.
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    #
    # base_footprint, not base_link, as in mapper_params_hardware.yaml.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_filtered
    mode: localization

    # map_start_pose is injected by launch/localize.launch.py from its launch
    # argument (default [0.0, 0.0, 0.0]). It is required: without it or
    # map_start_at_dock, localization mode skips loading the pose graph and
    # activates with an empty map (seen on the robot, 2026-10-03). It is a seed
    # for heading as much as position: the scan matcher's angular search
    # (coarse_search_angle_offset 0.349 rad, ~20 deg) cannot bridge more, and
    # a seed outside it fails silently with a wrong map->odom. If the robot
    # starts elsewhere, pass its real pose or publish it on `/initialpose`
    # (RViz "2D Pose Estimate") after activation.

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.025
    restamp_tf: false
    # LD19P range is 0.02-12 m; the shipped 0.0-20.0 would accept returns
    # beyond what the sensor can see.
    min_laser_range: 0.02
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    # As in mapper_params_hardware.yaml: encoder stamps are back-dated ~12 ms,
    # which a tight timeout turned into NoDataForExtrapolationException.
    transform_timeout: 1.0
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.15
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # Off as for mapping: in this small, symmetric 6x6 m arena loop closure
    # matched similar-looking corners and teleported part of the map tens of
    # meters away. Scan matching against the fixed map suffices for a short drive.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    # Wider than the shipped 0.5 m, so the matcher can recover when the
    # odometry-seeded centre is off by more than 0.5 m.
    correlation_search_space_dimension: 2.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
