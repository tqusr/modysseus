# laser_filters scan_to_scan_filter_chain: /scan -> /scan_filtered.
#
# The LD19 sees the robot's own two antennas, mounted behind the lidar at
# roughly 45 degrees to the left and right and ~16 cm away. Left in /scan they
# are mapped by slam_toolbox and seen by Nav2's costmaps and collision monitor
# as a permanent obstacle on the robot. Every /scan consumer reads
# /scan_filtered instead.
#
# The box is expressed in base_link (x forward, y left), NOT base_lidar_link:
# the lidar is mounted yawed 90 degrees (model.sdf), so "behind the robot" is
# +y in the lidar frame and a box there would be easy to get wrong. The lidar
# sits at x = +0.040 in base_link. The box is sized to cover both readings of
# the antenna description (16 cm radially along +-45 degrees, or 16 cm back
# with a +-45 degree lateral offset) with margin, and stops just behind the
# lidar so nothing in front of or beside it is ever dropped.
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: antenna_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.21
        max_x: -0.01
        min_y: -0.22
        max_y: 0.22
        min_z: -0.5
        max_z: 0.5
        invert: false
