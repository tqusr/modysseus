# laser_filters scan_to_scan_filter_chain: /scan -> /scan_filtered.
#
# The LD19 sees the robot's two antennas behind the lidar at roughly 45 degrees
# left and right. Left in, slam_toolbox maps them and Nav2 treats them as a
# permanent obstacle, so every /scan consumer reads /scan_filtered.
#
# The top-level key must equal the filter node's name (name='scan_filter' in
# mapping.launch.py and localize.launch.py). Keyed on the default executable
# name it loaded nothing and /scan_filtered was an unfiltered copy.
# test/test_scan_filter_config.py enforces this.
#
# Box: from the lidar back 20 cm and 10 cm to each side, in base_link (x
# forward, y left), not base_lidar_link, which is yawed +90 degrees. From
# `tf2_echo base_link base_lidar_link`: translation (0.040, 0.000, 0.040), yaw
# +90 deg, so x in [-0.160, 0.040], y in [-0.10, 0.10]. Measured antenna
# returns (r ~0.134 m) land at x ~ -0.06, |y| ~ 0.085-0.091, only ~1 cm inside
# the y limits. z is wide; the lidar plane is at z = 0.040.
scan_filter:
  ros__parameters:
    filter1:
      name: antenna_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.16
        max_x: 0.04
        min_y: -0.10
        max_y: 0.10
        min_z: -0.5
        max_z: 0.5
        invert: false
